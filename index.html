<body>

  <!-- ░░ LA PREMIÈRE — el estreno privado de su película ░░ -->
  <section id="landing" class="premiere">
    <div class="premiere__beam" aria-hidden="true"></div>
    <div class="premiere__motes" aria-hidden="true">
      <i style="--mx: 34%; --md: 0s; --ms: 12s;"></i>
      <i style="--mx: 41%; --md: -3s; --ms: 15s;"></i>
      <i style="--mx: 47%; --md: -7s; --ms: 11s;"></i>
      <i style="--mx: 52%; --md: -1.5s; --ms: 14s;"></i>
      <i style="--mx: 57%; --md: -9s; --ms: 12.5s;"></i>
      <i style="--mx: 63%; --md: -5s; --ms: 16s;"></i>
      <i style="--mx: 38%; --md: -11s; --ms: 13s;"></i>
      <i style="--mx: 60%; --md: -2.5s; --ms: 10.5s;"></i>
      <i style="--mx: 44%; --md: -6s; --ms: 17s;"></i>
      <i style="--mx: 55%; --md: -8.5s; --ms: 12s;"></i>
      <i style="--mx: 49%; --md: -4s; --ms: 15.5s;"></i>
      <i style="--mx: 66%; --md: -10s; --ms: 13.5s;"></i>
    </div>
    <div class="premiere__vignette" aria-hidden="true"></div>
    <div class="premiere__frame" aria-hidden="true"></div>
    <div class="premiere__bars" aria-hidden="true"></div>

    <div class="premiere__stage" id="premiere-stage">
      <p class="premiere__kicker premiere-enter" style="--pe: 1;">Una historia de amor</p>
      <h1 class="premiere__names premiere-enter" style="--pe: 2;">Marcel <span>&amp;</span> In&eacute;s</h1>
      <div class="premiere__rule premiere-enter" style="--pe: 3;" aria-hidden="true"></div>
      <div class="premiere__date premiere-enter" style="--pe: 4;" role="text" aria-label="Save the date: viernes 27 de noviembre de 2026">
        <svg class="premiere__date-arc" viewBox="0 0 300 58" aria-hidden="true">
          <defs><path id="datearc" d="M18 50 Q150 6 282 50"></path></defs>
          <text><textPath href="#datearc" startOffset="50%" text-anchor="middle">SAVE THE DATE</textPath></text>
        </svg>
        <p class="premiere__date-nums" aria-hidden="true"><span>27</span><i></i><span>11</span><i></i><span>2026</span></p>
        <p class="premiere__date-day" aria-hidden="true">Viernes</p>
      </div>

      <button type="button" id="premiere-play" class="premiere__play premiere-enter" style="--pe: 5;" aria-label="Ver nuestra pelicula">
        <svg class="premiere__ring" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <path id="ringpath" d="M60 13 a47 47 0 1 1 -0.01 0"></path>
          </defs>
          <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(232, 211, 160, 0.3)" stroke-width="1"></circle>
          <text><textPath href="#ringpath" startOffset="0%">NUESTRA PEL&Iacute;CULA &middot; TOCA PARA VERLA &middot; NUESTRA PEL&Iacute;CULA &middot;</textPath></text>
        </svg>
        <span class="premiere__play-core" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9.2 6.6 L17.6 12 L9.2 17.4 Z" fill="currentColor"></path></svg>
        </span>
      </button>
      <div class="premiere__soundtag premiere-enter" style="--pe: 6;" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 L7.5 9.5 L12 5.5 L12 18.5 L7.5 14.5 L4 14.5 Z"></path><path d="M15.5 9 C 16.6 10.7, 16.6 13.3, 15.5 15"></path><path d="M18 6.8 C 20.2 9.7, 20.2 14.3, 18 17.2"></path></svg>
        <span>Con sonido</span>
      </div>
    </div>

    <!-- El monograma se dibuja en linea de oro antes de la pelicula -->
    <div class="premiere__mono" id="premiere-mono" hidden aria-hidden="true">
      <svg class="premiere__mono-svg" viewBox="0 0 440 200">
        <text class="premiere__mono-text" x="220" y="132" text-anchor="middle">M &amp; I</text>
      </svg>
    </div>

    <!-- Iris dorado que abre la pelicula -->
    <div class="premiere__iris" id="premiere-iris" aria-hidden="true"></div>

    <audio id="bg-audio" loop preload="auto">
      <source src="cancion.mp3" type="audio/mpeg" />
    </audio>
  </section>

  <div id="invitation-overlay" class="invitation-overlay" aria-hidden="true">
    <iframe
      id="invitation-frame"
      src="invitation.html"
      title="Invitacion de boda Marcel e Ines"
      loading="eager"
    ></iframe>
  </div>

  <script src="app.js?v=20260903c"></script>
